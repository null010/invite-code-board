name: Sync target invite codes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-target-codes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge target data
        run: python scripts/sync_target_codes.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- codes.json; then
            echo "DATA_CHANGED=false" >> "$GITHUB_ENV"
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codes.json
          git commit -m "chore: sync target invite codes"
          git push
          echo "DATA_CHANGED=true" >> "$GITHUB_ENV"

      - name: Configure Pages
        if: env.DATA_CHANGED == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: env.DATA_CHANGED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Wait for artifact registration
        if: env.DATA_CHANGED == 'true'
        run: sleep 10

      - name: Deploy to Pages
        if: env.DATA_CHANGED == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
