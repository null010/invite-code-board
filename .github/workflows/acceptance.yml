name: Verify published invite codes

on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify live sources and published data
        run: python scripts/acceptance.py

