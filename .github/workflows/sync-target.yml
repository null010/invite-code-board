name: Sync target invite codes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-target-codes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge target data
        run: python scripts/sync_target_codes.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- codes.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codes.json
          git commit -m "chore: sync target invite codes"
          git push

